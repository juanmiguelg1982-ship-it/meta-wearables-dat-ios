workflows:
  camera-access:
    name: CameraAccess Example
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.juanmi.bidglasses
    scripts:
      - name: Fix entitlements
        script: |
          cd samples/CameraAccess
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.networking.wifi-info" CameraAccess/CameraAccess.entitlements 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.networking.HotspotConfiguration" CameraAccess/CameraAccess.entitlements 2>/dev/null || true
      - name: Build CameraAccess
        script: |
          cd samples/CameraAccess
          xcodebuild -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -destination generic/platform=iOS \
            -archivePath build/CameraAccess.xcarchive \
            archive \
            DEVELOPMENT_TEAM=L9M5LHV7CF \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development: Created via API (8MZ5SL5DVG)" \
            PROVISIONING_PROFILE_SPECIFIER="BIDDev2" \
            PRODUCT_BUNDLE_IDENTIFIER=com.juanmi.bidglasses
      - name: Export IPA
        script: |
          /usr/libexec/PlistBuddy -c "Add :method string debugging" /tmp/export.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string L9M5LHV7CF" /tmp/export.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" /tmp/export.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" /tmp/export.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.juanmi.bidglasses string a51c94a0-1008-4106-aff4-a272c4543559" /tmp/export.plist
          xcodebuild -exportArchive \
            -archivePath samples/CameraAccess/build/CameraAccess.xcarchive \
            -exportPath samples/CameraAccess/build/ipa \
            -exportOptionsPlist /tmp/export.plist
    artifacts:
      - samples/CameraAccess/build/ipa/*.ipa
      - "**/*.ipa"
