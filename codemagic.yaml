workflows:
  camera-access:
    name: CameraAccess Example
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.juanmi.bidglasses
    scripts:
      - name: Build CameraAccess
        script: |
          cd samples/CameraAccess
          xcodebuild -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -destination generic/platform=iOS \
            -archivePath build/CameraAccess.xcarchive \
            archive \
            DEVELOPMENT_TEAM=L9M5LHV7CF \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development: juan miguel goñi (JKP3HXA8PR)" \
            PROVISIONING_PROFILE_SPECIFIER="BID Glasses Development" \
            PRODUCT_BUNDLE_IDENTIFIER=com.juanmi.bidglasses
      - name: Export IPA
        script: |
          cat > /tmp/export.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>L9M5LHV7CF</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath samples/CameraAccess/build/CameraAccess.xcarchive \
            -exportPath samples/CameraAccess/build/ipa \
            -exportOptionsPlist /tmp/export.plist
    artifacts:
      - samples/CameraAccess/build/ipa/*.ipa
